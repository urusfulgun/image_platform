server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. KeyCloak (Identity) — auth flows
    location /auth/ {
        # Docker's internal DNS IP
        resolver 127.0.0.11 valid=30s;
        set $kc_upstream http://keycloak:8080;
        proxy_pass $kc_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve KeyCloak redirect URIs
        proxy_buffer_size 64k;
        proxy_buffers 4 64k;
    }

    # 2. BFF Token Handler (API + auth callbacks routed through /api/)
    location /api/ {
        # Docker's internal DNS IP
        resolver 127.0.0.11 valid=30s;
        set $bff_upstream http://bff-token-handler:8000;

        rewrite ^/api/(.*) /$1 break;
        proxy_pass $bff_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward cookies unchanged (session cookie)
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;

        # Increase timeouts for large uploads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500M;
    }

    # 3. Angular SPA (everything else)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
    
    location /health {
    access_log off;
    return 200 'OK';
    add_header Content-Type text/plain;
}
}