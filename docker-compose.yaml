services:
  postgres-keycloak:
    image: postgres:16
    volumes:
      - postgres_data_keycloak:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxynet

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.3
    command: start-dev
    environment:
      - KC_HOSTNAME_URL=http://keycloak:8080
      - KC_HOSTNAME_STRICT=false
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres-keycloak/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=password
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    ports:
      - "8080:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    networks:
      - proxynet

  bff-keycloak:
    build:
      context: .
      dockerfile: docker/bff-keycloak.Dockerfile
      target: production
    depends_on:
      - keycloak
    environment:
      - PYTHONPATH=:/app/src:/app/tests
      - API_HOST=bff-keycloak
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - UV_DEFAULT_ENV_FILE=:.env
      - GRANIAN_HOST=0.0.0.0
      - GRANIAN_PORT=8000
      - GRANIAN_INTERFACE=asgi
      # - GRANIAN_SSL_CERTIFICATE=/certs/cert.pem
      # - GRANIAN_SSL_KEYFILE=/certs/key.pem
    # entrypoint: /app/entrypoint.sh
    ports:
      - "8000:8000"
    # volumes:
    #   - ./services/bff-keycloak:/app:cached
    networks:
      - proxynet
    command: >
      uv run 
      granian src.bff_keycloak.main:app  
      --interface asgi
    # healthcheck:
    #   test: ["CMD", "curl", "--resolve", "bff-keycloak:8000:127.0.0.1", "-f", "http://bff-keycloak:8000/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    # entrypoint: /app/entrypoint.sh

  resource-server:
    build:
      context: .
      dockerfile: docker/resource-server.Dockerfile
      target: production
    depends_on:
      - keycloak
    environment:
      - PYTHONPATH=:/app/src:/app/tests
      - API_HOST=resource-server
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - UV_DEFAULT_ENV_FILE=:.env
      - GRANIAN_HOST=0.0.0.0
      - GRANIAN_PORT=8001
      - GRANIAN_INTERFACE=asgi
      # - GRANIAN_SSL_CERTIFICATE=/certs/cert.pem
      # - GRANIAN_SSL_KEYFILE=/certs/key.pem
    # entrypoint: /app/entrypoint.sh
    ports:
      - "8001:8001"
    # volumes:
    #   - ./services/bff-keycloak:/app:cached
    networks:
      - proxynet
    command: >
      uv run 
      granian src.resource_server_keycloak.main:app  
      --interface asgi

  # Nginx Reverse Proxy
  nginx-gateway:
    image: nginx:latest
    container_name: nginx_proxy_api_gateway
    volumes:
      - ./reverse_proxy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/nginx/certs/nginx-gateway-cert.pem:/etc/nginx/ssl/nginx-gateway-cert.pem:ro
      - ./secrets/nginx/certs/nginx-gateway-key.pem:/etc/nginx/ssl/nginx-gateway-key.pem:ro
      - ./ca-certificates/mkcert-root.crt:/usr/local/share/ca-certificates/mkcert-root.crt:ro
    ports:
      - "55443:443"
      - "55800:80"
    networks:
      - proxynet
    depends_on:
      - api-gateway
      # - api:
      #     condition: service_healthy
    restart: always

  api-gateway:
    build:
      context: ./services/api-gateway/api_gateway/
      dockerfile: docker/api-gateway.Dockerfile
      target: production
    depends_on:
      - rustfs
    environment:
      - PYTHONPATH=:/app/src:/app/tests
      - API_HOST=api
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - UV_DEFAULT_ENV_FILE=:.env
      - GRANIAN_HOST=0.0.0.0
      - GRANIAN_PORT=5000
      - GRANIAN_INTERFACE=asgi
      # - GRANIAN_SSL_CERTIFICATE=/certs/cert.pem
      # - GRANIAN_SSL_KEYFILE=/certs/key.pem
    entrypoint: /app/entrypoint.sh
    ports:
      - "5000:5000"
    volumes:
      - .:/app:cached
    networks:
      - proxynet
    command: >
      uv run --env-file=.env 
      granian src.image_converter_api_gateway.entrypoints.main:app  
      --interface asgi
    healthcheck:
      # This command 'test' runs inside the web-app container
      # test: ["CMD", "curl", "--resolve", "api-gateway:9443:127.0.0.1", "--cacert", "/usr/local/share/ca-certificates/mkcert-root.crt", "-f", "https://api-gateway:9443/health"]
      test: ["CMD", "curl", "--resolve", "api-gateway:5000:127.0.0.1", "-f", "http://api-gateway:9443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # entrypoint: /app/entrypoint.sh

  redis:
    image: redis:7.2-alpine
    container_name: redis_server
    restart: always
    ports:
      - "6379:6379"
    volumes: 
      - redis_data:/data
    # command: redis-server --appendonly yes --requirepass yourpassword
    # Uncomment the command above to enable data persistence (AOF) and set a password

  rustfs:
    container_name: rustfs_storage
    image: rustfs/rustfs:latest  # Use the official RustFS image
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      # RustFS typically looks in /etc/rustfs/certs for TLS files
      # - ./secrets/rustfs/certs/rustfs_cert.pem:/opt/tls/rustfs_cert.pem:ro
      # - ./secrets/rustfs/certs/rustfs_key.pem:/opt/tls/rustfs_key.pem:ro
      # Data persistence
      # - ./persistent_data/rustfs/data:/data
      - rastfs_data:/data
    environment:
      # - RUSTFS_VOLUMES=/data/rustfs{0..3} # Define 4 storage volumes
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_EXTERNAL_ADDRESS=:9000 # Same as internal since no port mapping
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=admin
      - RUSTFS_SECRET_KEY=password
      - RUSTFS_OBS_LOGGER_LEVEL=info
      # - RUSTFS_TLS_PATH=/opt/tls
    networks:
      - proxynet
    # healthcheck:
    #   test:
    #     [
    #       "CMD",
    #       "sh", "-c",
    #       "curl -f http://localhost:9000/health && curl -f http://localhost:9001/rustfs/console/health"
    #     ]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s
  
  postgres:
    restart: always
    image: postgres:16
    environment:
      - POSTGRES_USER=authentication
      - POSTGRES_PASSWORD=abc123
      - POSTGRES_DB=authentication
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
    # Map your local script to the magic init folder in the container
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./init-db:/docker-entrypoint-initdb.d
    # Persist your data so it doesn't disappear when the container stops
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - proxynet

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: example@example.com
      PGADMIN_DEFAULT_PASSWORD: password#11
    # depends_on:
    #   - postgres
    networks:
      - proxynet
  
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "9092:9092" # Plaintext
      - "9093:9093" # SSL (mTLS)
    environment:
        # Fixes the error in your logs:
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
        
       # Additional stability for single-node setups:
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      # --- KRaft Mode Setup ---
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9094
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      
      # --- Listeners ---
      - KAFKA_LISTENERS=PLAINTEXT://:9092,SSL://:9093,CONTROLLER://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,SSL://kafka:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,SSL:SSL,CONTROLLER:PLAINTEXT
      
      # --- mTLS / SSL Settings ---
      - KAFKA_SSL_KEYSTORE_FILENAME=kafka.kafka-1.keystore.pkcs12
      - KAFKA_SSL_KEYSTORE_CREDENTIALS=kafka-1_keystore_creds
      - KAFKA_SSL_KEY_CREDENTIALS=kafka-1_sslkey_creds

      - KAFKA_SSL_TRUSTSTORE_FILENAME=kafka.kafka-1.truststore.pkcs12
      - KAFKA_SSL_TRUSTSTORE_CREDENTIALS=kafka-1_truststore_creds

      # FIX: Official Apache image requires these exact names to pass the "ensure" check

      # FIX: Point these to the FILE path, not the password string
      
      # Forces Python/Kafka-UI to provide their own certificates
      - KAFKA_SSL_CLIENT_AUTH=required
      
      # Security Overrides for Local Development
      - KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM=
      - KAFKA_SSL_PROTOCOL=TLSv1.3
      
      # KRaft Required
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - ./persistent_data/kafka:/var/lib/kafka/data
      - ./secrets/kafka:/etc/kafka/secrets
    networks:
      - proxynet
    
networks:
  proxynet:
    name: custom_network

volumes:
  postgres_data:
  postgres_data_keycloak:
  redis_data:
  rastfs_data:
