<mat-toolbar color="primary" class="mat-elevation-z4">
  <mat-icon style="margin-right: 10px;">shield</mat-icon>
  <span>Secure File Gateway</span>
  <span class="spacer"></span>
  <!-- <button mat-icon-button>
    <mat-icon>account_circle</mat-icon>
  </button> -->
  <a mat-flat-button color="accent" href="http://localhost:8000/login">
    <mat-icon>login</mat-icon>
    Sign In with Keycloak
  </a>
</mat-toolbar>

<div class="main-container">
  <mat-card class="upload-card">
    <mat-card-header>
      <mat-card-title>Direct-to-S3 Upload</mat-card-title>
      <mat-card-subtitle>Authenticated via Python BFF</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p>This component uses DPoP proofs to request presigned URLs from your Resource Server.</p>
      <app-uploader />
    </mat-card-content>

    <mat-card-footer>
      <mat-progress-bar mode="buffer"></mat-progress-bar>
    </mat-card-footer>
  </mat-card>
</div>
