<mat-toolbar color="primary" class="mat-elevation-z4">
  <mat-icon style="margin-right: 10px;">shield</mat-icon>
  <span routerLink="/" style="cursor: pointer">Secure File Gateway</span>
  <span class="spacer"></span>

  @if (profileService.user(); as user) {
    <div class="user-chip">
      <mat-icon>account_circle</mat-icon>
      <span class="username">{{ user.preferred_username }}</span>
      <button mat-icon-button (click)="logout()">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  } @else {
    <a mat-flat-button color="accent" href="http://localhost:8000/login">
      <mat-icon>login</mat-icon>
      Sign In
    </a>
  }
</mat-toolbar>

<div class="main-container">
  <app-profile class="profile-summary" />

  <router-outlet></router-outlet>
</div>
