[project]
name = "bff-token-handler"
version = "0.1.0"
description = "BFF Token Handler — OAuth2 PKCE + DPoP security proxy for Image Platform"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "shared-core",
    "fastapi>=0.131.0",
    "granian>=2.7.1",
    "python-keycloak>=7.1.1",
    "redis[asyncio]>=7.2.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.13.1",
    "cryptography>=46.0.5",
    "python-multipart>=0.0.22",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared-core = { path = "../shared-core", editable = true }
