[project]
name = "shared-core"
version = "0.1.0"
description = "Shared Pydantic models, Kafka event schemas, and utilities for Image Platform services"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "pydantic[email,timezone]>=2.12.5",
    "pydantic-settings>=2.13.1",
    "aiokafka>=0.13.0",
    "pyjwt>=2.11.0",
    "fastapi>=0.135.1",
    "cryptography>=46.0.5",
    "python-keycloak>=7.1.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
# Tests are type-checked but don't need annotations.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
check_untyped_defs = true
