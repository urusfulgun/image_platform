[project]
name = "shared-core"
version = "0.1.0"
description = "Shared Pydantic models, Kafka event schemas, and utilities for Image Platform services"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "pydantic[email,timezone]>=2.12.5",
    "pydantic-settings>=2.13.1",
    "aiokafka>=0.13.0",
    "pyjwt>=2.11.0",
    "fastapi>=0.135.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
