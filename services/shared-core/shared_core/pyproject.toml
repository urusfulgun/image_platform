[project]
name = "shared-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "urusfulgun", email = "panterapardusspelaea48@gmail.com" }
]
requires-python = ">=3.14.2"
dependencies = [
    "fastapi>=0.128.5",
    "httpx>=0.28.1",
    "joserfc>=1.6.1",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
