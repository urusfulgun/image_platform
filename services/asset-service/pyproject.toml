[project]
name = "asset-service"
version = "0.1.0"
description = "AssetService — project and image management for Image Platform"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "shared-core",
    "fastapi>=0.131",
    "granian>=2.7.1",
    "sqlalchemy[asyncio]>=2.0.46",
    "asyncpg>=0.31",
    "aiokafka>=0.13.0",
    "boto3>=1.42.54",
    "pydantic-settings>=2.13.1",
    "python-keycloak>=7.1.1",
    "python-multipart>=0.0.22",
    "types-boto3[essential]>=1.42.58",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.1",
    "aiosqlite>=0.21.1",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared-core = { path = "../shared-core", editable = true }
