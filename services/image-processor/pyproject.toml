[project]
name = "image-processor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "aioboto3>=15.5.0",
    "fastapi>=0.134.0",
    "pillow>=12.1.1",
    "pillow-avif-plugin>=1.5.5",
    "shared-core",
    "types-aioboto3[essential]>=15.5.0",
    "uvicorn>=0.41.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared-core = { path = "../shared-core", editable = true }

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
# aiokafka ships no type information and has no stubs package.
module = ["aiokafka"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests are type-checked but don't need annotations.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
check_untyped_defs = true
