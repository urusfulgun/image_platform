[project]
name = "image-processor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "aioboto3>=15.5.0",
    "fastapi>=0.134.0",
    "pillow>=12.1.1",
    "pillow-avif-plugin>=1.5.5",
    "shared-core",
    "types-aioboto3[essential]>=15.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.1",
]

[project.scripts]
image-processor = "image_processor:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared-core = { path = "../shared-core", editable = true }
