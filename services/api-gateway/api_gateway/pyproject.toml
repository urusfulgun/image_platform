[project]
name = "api-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "urusfulgun", email = "panterapardusspelaea48@gmail.com" }
]
requires-python = ">=3.14.2"
dependencies = [
    "fastapi>=0.128.0",
    "granian>=2.7.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "sqlmodel>=0.0.32",
    "asyncpg>=0.31.0",
    "aiokafka>=0.13.0",
    "aioboto3>=15.5.0",
    "joserfc>=1.6.1",
    "cryptography>=46.0.4",
    "types-aiobotocore-s3>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "testcontainers[postgresql,kafka]>=4.14.1",
]

[project.scripts]
api-gateway = "api_gateway:main"

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"
