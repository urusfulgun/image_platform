# CI for every PR and every push to main (roadmap F8, docs/specs/2026-10-27-github-actions-ci).
# Actions are pinned to full commit SHAs; tool versions are exact.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.5"
  RUFF_VERSION: "0.17.2"

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          # The root has no uv.lock to key a cache on.
          enable-cache: false
      # One run from the root covers every service: ruff.toml lives here.
      - run: uvx "ruff@${RUFF_VERSION}" check .
      - run: uvx "ruff@${RUFF_VERSION}" format --check .

  python:
    name: python (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - shared-core
          - asset-service
          - bff-token-handler
          - image-processor
          - email-notification
          - cleanup-buckets
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      # Python comes from the service's .python-version. --locked fails on a stale uv.lock.
      - run: uv sync --locked --extra dev
      - name: mypy (baseline)
        run: uv run --extra dev python ../../scripts/mypy_check.py
      - name: pytest (coverage floor)
        run: uv run --extra dev pytest --cov

  frontend:
    name: frontend (build, vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: services/frontend/package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test --watch=false

  e2e:
    name: frontend (playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: services/frontend/package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox
      # GitHub sets CI=true, which playwright.config.ts uses for retries, workers and reporters.
      - run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            services/frontend/playwright-report/
            services/frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
