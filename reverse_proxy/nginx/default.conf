# Standard development config for Nginx
server {
    listen 80;
    server_name localhost;
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    # 1. External SSL (Client <-> Nginx)
    # These are the certs you generated for 'localhost'
    ssl_certificate     /etc/nginx/ssl/nginx-gateway-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/nginx-gateway-key.pem;

    # Performance & Security Optimizations
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers  on;
    client_max_body_size 500M;

    location / {
        # 2. M2M SSL (Nginx <-> Granian)
        # We use 'https' here because Granian is running with SSL enabled
        # proxy_pass https://api-gateway:9443;
        proxy_pass http://frontend:3000;

        # Optimization for large file streams (Uploads/Downloads)
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;

        # Standard headers to pass client info to FastAPI
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Optional: Verify the Granian cert if you want strict M2M
        # proxy_ssl_trusted_certificate /etc/nginx/ssl/rootCA.pem;
        # proxy_ssl_trusted_certificate /usr/local/share/ca-certificates/mkcert-root.crt;
        # proxy_ssl_verify on;
    }

    location /api/ {
        # 2. M2M SSL (Nginx <-> Granian)
        # We use 'https' here because Granian is running with SSL enabled
        # proxy_pass https://api-gateway:9443;
        proxy_pass http://api-gateway:9000;

        # Optimization for large file streams (Uploads/Downloads)
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;

        # Standard headers to pass client info to FastAPI
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Optional: Verify the Granian cert if you want strict M2M
        # proxy_ssl_trusted_certificate /etc/nginx/ssl/rootCA.pem;
        # proxy_ssl_trusted_certificate /usr/local/share/ca-certificates/mkcert-root.crt;
        # proxy_ssl_verify on;
    }
}